[project]
name = "tp-icu-sync"
version = "0.1.0"
description = "Sync planned workouts from TrainingPeaks to intervals.icu (with structured power/pace/HR targets)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Sladck" },
]
keywords = [
    "trainingpeaks",
    "intervals.icu",
    "training",
    "cycling",
    "running",
    "triathlon",
    "sync",
    "calendar",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Other/Nonlisted Topic",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/Sladck/trainingpeaks-to-intervals-icu"
Repository = "https://github.com/Sladck/trainingpeaks-to-intervals-icu"
Issues = "https://github.com/Sladck/trainingpeaks-to-intervals-icu/issues"

[project.scripts]
tp-icu-sync = "tp_icu_sync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tp_icu_sync"]
